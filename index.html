<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chart Tools — Trendline / Box / PnL</title>
<script>
  // Load the charting library with a fallback CDN, and fail loudly (not silently)
  // if neither is reachable — better than a blank screen with a console-only error.
  // A stalled/blocked request that never fires onload OR onerror (e.g. silently
  // dropped by a CSP) would otherwise hang this forever, so each attempt also
  // races against a timeout.
  function loadScript(src, timeoutMs) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.crossOrigin = 'anonymous'; // without this, errors thrown inside the CDN
      // script get reported as opaque "Script error." with no message/line/stack —
      // this unlocks real error detail, since jsdelivr/unpkg both send proper CORS headers
      const timer = setTimeout(() => reject(new Error('timeout loading ' + src)), timeoutMs);
      s.onload = () => { clearTimeout(timer); resolve(); };
      s.onerror = () => { clearTimeout(timer); reject(new Error('failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }
  // Global handler: surfaces whatever detail IS available for any uncaught
  // error into the on-page debug line, instead of leaving it console-only.
  window.addEventListener('error', (e) => {
    const msg = e.message || 'Script error.';
    const loc = e.filename ? ` (${e.filename.split('/').pop()}:${e.lineno}:${e.colno})` : '';
    console.error('Uncaught error:', msg + loc, e.error);
    const dbg = document.getElementById('debugLine');
    if (dbg) { dbg.textContent = 'Runtime error: ' + msg + loc; dbg.style.color = '#ef5350'; }
  });
  function showLoadError(detail) {
    document.body.innerHTML =
      '<div style="padding:24px;color:#ef5350;font-family:sans-serif;background:#131722;height:100%">' +
      '<h3>Chart library failed to load</h3>' +
      '<p style="color:#d1d4dc">Both CDN sources for lightweight-charts were unreachable from this device/network. ' +
      'Try a different network, or download lightweight-charts.standalone.production.js and reference it as a local file instead of a CDN link.</p>' +
      '<p style="color:#787b86;font-size:12px">' + (detail || '') + '</p>' +
      '</div>';
  }
  window.__chartsReady = loadScript('https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js', 6000)
    .catch(() => loadScript('https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js', 6000))
    .catch((err) => { showLoadError(err.message); throw err; });
</script>
<style>
  :root{
    --bg:#131722; --panel:#1e222d; --border:#2a2e39; --text:#d1d4dc; --muted:#787b86;
    --accent:#2962ff; --green:#26a69a; --red:#ef5350; --greenSoft:rgba(38,166,154,0.18); --redSoft:rgba(239,83,80,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100%;}
  #header{background:var(--panel);border-bottom:1px solid var(--border);}
  #headerTop{display:flex;align-items:center;gap:10px;padding:8px 10px;}
  #symbolName{font-weight:600;font-size:15px;background:none;border:1px solid transparent;color:var(--text);width:88px;padding:2px 4px;border-radius:4px;font-family:inherit;text-transform:uppercase;}
  #symbolName:focus{outline:none;border-color:var(--accent);background:var(--bg);}
  #lastPrice{font-size:14px;font-family:monospace;color:var(--text);}
  #lastPrice.up{color:var(--green);}
  #lastPrice.down{color:var(--red);}
  #connStatus{width:8px;height:8px;border-radius:50%;margin-left:auto;flex-shrink:0;}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  #connStatus.connected{background:var(--green);}
  #connStatus.connecting{background:#e6a23c;animation:pulse 1s infinite;}
  #connStatus.disconnected{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  #tfRow{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;}
  .tf-btn{
    flex-shrink:0;padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:5px;
    color:var(--muted);font-size:12px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .tf-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);}
  .tool-btn{
    display:flex;align-items:center;gap:5px;padding:8px 10px;background:transparent;border:1px solid var(--border);
    border-radius:6px;color:var(--text);font-size:13px;cursor:pointer;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;
  }
  .tool-btn:active{background:#2a2e39;}
  .tool-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tool-btn.danger:active{background:var(--red);color:#fff;}
  .sep{width:1px;height:22px;background:var(--border);margin:0 2px;}
  #hintRow{padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  #chart-container{position:relative;flex:1;min-height:300px;}
  #debugLine{padding:4px 10px;font-size:10px;color:var(--muted);background:var(--panel);font-family:monospace;}

  /* ---- Risk bar: kept intentionally compact (~72px total) so it doesn't
     eat chart space — collapses two dense rows instead of a tall panel ---- */
  #riskBar{background:var(--panel);border-top:1px solid var(--border);padding:6px 10px;flex-shrink:0;}
  #riskBarRow1{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  #balanceLabel{font-size:11px;color:var(--muted);white-space:nowrap;}
  #balanceValue{color:var(--text);font-family:monospace;}
  #simBadge{font-size:9px;font-weight:700;letter-spacing:0.5px;color:#e6a23c;border:1px solid #e6a23c;border-radius:4px;padding:1px 5px;}
  #riskModeToggle{display:flex;margin-left:auto;border:1px solid var(--border);border-radius:5px;overflow:hidden;}
  .mode-btn{padding:4px 8px;background:transparent;border:none;color:var(--muted);font-size:11px;cursor:pointer;touch-action:manipulation;}
  .mode-btn.active{background:var(--accent);color:#fff;}
  #riskValueInput{
    width:64px;padding:4px 6px;background:var(--bg);border:1px solid var(--border);border-radius:5px;
    color:var(--text);font-size:12px;font-family:monospace;text-align:right;
  }
  #riskBarRow2{display:flex;gap:8px;}
  .side-btn{flex:1;padding:9px;border:none;border-radius:6px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .side-btn.long{background:var(--green);}
  .side-btn.short{background:var(--red);}
  .side-btn:disabled{opacity:0.4;}

  /* ---- Confirmation modal: bottom sheet, kept compact and inset from
     the screen edges — a floating card, not a full-width sheet ---- */
  #modalOverlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;
    align-items:flex-end;justify-content:center;padding:0 20px 20px;
  }
  #modalOverlay.open{display:flex;}
  #confirmModal{
    width:100%;max-width:340px;max-height:60vh;overflow-y:auto;background:var(--panel);
    border-radius:12px;padding:12px 14px;
  }
  #modalHeader{display:flex;align-items:center;margin-bottom:8px;}
  #modalTitle{font-weight:600;font-size:13px;}
  #modalClose{margin-left:auto;background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 6px;}
  #modalBody{font-size:12px;}
  .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);}
  .row .k{color:var(--muted);}
  .row .v{font-family:monospace;}
  .row .v.long{color:var(--green);}
  .row .v.short{color:var(--red);}
  .warn{background:rgba(239,83,80,0.12);border:1px solid var(--red);border-radius:6px;padding:6px 8px;margin:8px 0;font-size:11px;color:var(--red);}
  #modalFooter{display:flex;gap:8px;margin-top:10px;}
  .modal-btn{flex:1;padding:9px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;}
  .modal-btn.cancel{background:var(--border);color:var(--text);}
  .modal-btn.confirm{background:var(--accent);color:#fff;}
  .modal-btn.confirm:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}

  /* ---- Settings / Journal sheets — same bottom-sheet pattern as Confirm ---- */
  .sheet-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;
    align-items:flex-end;justify-content:center;padding:0 20px 20px;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{width:100%;max-width:360px;max-height:75vh;overflow-y:auto;background:var(--panel);border-radius:12px;padding:12px 14px;}
  .sheet-title{font-weight:600;font-size:13px;}
  .sheet-body{font-size:12px;}
  .field-label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;}
  .field-sep{height:1px;background:var(--border);margin:12px 0 6px;}
  #settingsOverlay select, #settingsOverlay input{
    width:100%;padding:7px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;
    color:var(--text);font-size:12px;font-family:monospace;
  }
  .mode-toggle{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;width:fit-content;}
  .mode-toggle .mode-btn{padding:5px 12px;}

  /* ---- Journal entries ---- */
  .journal-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .journal-entry .je-main{display:flex;flex-direction:column;gap:2px;}
  .journal-entry .je-symbol{font-size:12px;font-weight:600;}
  .journal-entry .je-detail{font-size:10px;color:var(--muted);font-family:monospace;}
  .journal-entry .je-pnl{font-family:monospace;font-size:13px;font-weight:600;}
  .journal-entry .je-pnl.win{color:var(--green);}
  .journal-entry .je-pnl.loss{color:var(--red);}
  .journal-empty{color:var(--muted);font-size:12px;text-align:center;padding:20px 0;}
</style>

<script>
(async function main() {
await window.__chartsReady; // wait for the CDN script to actually finish loading

/* ============================================================
   1. COORDINATE HELPERS (declared first — used during initial data load below)
   ============================================================ */
// bar interval in seconds, derived from the actual data — used to extrapolate
// time values into the reserved future whitespace, where coordinateToTime()
// alone returns null because there's no real candle there yet.
let barIntervalSeconds = 86400;
function computeBarInterval(data) {
  if (data.length >= 2) barIntervalSeconds = data[data.length - 1].time - data[data.length - 2].time;
}

function timeToX(t) { return chart.timeScale().timeToCoordinate(t); }
function xToTime(x) {
  const t = chart.timeScale().coordinateToTime(x);
  if (t !== null) return t;
  // past the last loaded candle (future whitespace) — extrapolate from the
  // logical bar index instead, which stays valid past the data edge
  const logical = chart.timeScale().coordinateToLogical(x);
  if (logical === null) return null;
  const data = series.data();
  if (!data.length) return null;
  const lastLogical = data.length - 1;
  const lastTime = data[lastLogical].time;
  return Math.round(lastTime + (logical - lastLogical) * barIntervalSeconds);
}
function priceToY(p) { return series.priceToCoordinate(p); }
function yToPrice(y) { return series.coordinateToPrice(y); }

// shift an x-coordinate by a fixed number of *screen pixels* and convert back
// to a time value — this is what keeps the PnL box a constant visual size
// regardless of zoom level, instead of a fixed bar-count (bug #3: 15 bars
// shrinks to nothing when zoomed out, or fills the screen when zoomed in).
function addPixels(xRef, pixels) { return xToTime(xRef + pixels); }

function bitX(scope, mediaX) { return Math.round(mediaX * scope.horizontalPixelRatio); }
function bitY(scope, mediaY) { return Math.round(mediaY * scope.verticalPixelRatio); }

const HANDLE_R = 5;       // px radius for the visible endpoint handle dot
const HIT_TOL = 14;       // px tolerance for hit-testing — generous for touch/fingertip accuracy

/* ============================================================
   2. DATA SOURCE ABSTRACTION
   ------------------------------------------------------------
   Every consumer (chart init, timeframe switching, future Bybit
   integration) talks to `dataSource` through this same interface:
     fetchKlines(symbol, timeframe, limit) -> Promise<Candle[]>
     getInstrumentInfo(symbol)             -> Promise<InstrumentInfo>
     subscribeKlines(symbol, timeframe, handlers) -> stream handle with .close()
   Phase 4 swaps MockDataSource for a BybitDataSource implementing
   the exact same three methods — nothing above this layer changes.
   ============================================================ */
const TIMEFRAMES = ['1m', '3m', '5m', '15m', '30m', '1h', '4h', '1d'];
const TF_SECONDS = { '1m': 60, '3m': 180, '5m': 300, '15m': 900, '30m': 1800, '1h': 3600, '4h': 14400, '1d': 86400 };

// deterministic seeded RNG (mulberry32) — so re-fetching the same symbol+timeframe
// combo produces the same-shaped candles within a session, like a real cached feed
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (Math.imul(31, h) + s.charCodeAt(i)) | 0; }
  return h >>> 0;
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// mock per-symbol instrument metadata — shape matches what Bybit's real
// instrument-info endpoint returns, so Phase 4 is a drop-in data swap
const MOCK_INSTRUMENTS = {
  BTCUSDT: { tickSize: 0.1, qtyStep: 0.001, minOrderQty: 0.001, maxLeverage: 100, basePrice: 65000 },
  ETHUSDT: { tickSize: 0.01, qtyStep: 0.01, minOrderQty: 0.01, maxLeverage: 100, basePrice: 3400 },
  SOLUSDT: { tickSize: 0.001, qtyStep: 0.1, minOrderQty: 0.1, maxLeverage: 75, basePrice: 145 },
  DEFAULT: { tickSize: 0.01, qtyStep: 0.01, minOrderQty: 0.01, maxLeverage: 50, basePrice: 100 },
};

class MockDataSource {
  async fetchKlines(symbol, timeframe, limit = 300) {
    const info = MOCK_INSTRUMENTS[symbol] || MOCK_INSTRUMENTS.DEFAULT;
    const rand = mulberry32(hashStr(symbol + ':' + timeframe));
    const interval = TF_SECONDS[timeframe] || 86400;
    const data = [];
    let price = info.basePrice;
    let t = Math.floor(Date.now() / 1000 / interval) * interval - limit * interval;
    for (let i = 0; i < limit; i++) {
      const open = price;
      const volatility = price * 0.006;
      const close = Math.max(price * 0.01, open + (rand() - 0.5) * volatility * 2);
      const high = Math.max(open, close) + rand() * volatility;
      const low = Math.max(price * 0.005, Math.min(open, close) - rand() * volatility);
      data.push({ time: t, open, high, low, close });
      price = close;
      t += interval;
    }
    return data;
  }

  async getInstrumentInfo(symbol) {
    return MOCK_INSTRUMENTS[symbol] || MOCK_INSTRUMENTS.DEFAULT;
  }

  // handlers: { onCandle(candle, isNewBar), onStatus('connecting'|'connected'|'disconnected') }
  // seedCandle: the last real (non-whitespace) candle already loaded via
  // fetchKlines — the stream continues from exactly that bar instead of
  // independently guessing "now", which previously caused an off-by-one-bar
  // mismatch (the stream assumed the currently-forming bar already existed
  // in history, and stomped the last historical bar's time forward by one
  // full interval, colliding with the whitespace point right after it).
  subscribeKlines(symbol, timeframe, handlers, seedCandle) {
    return new ReconnectingStream(symbol, timeframe, handlers, seedCandle);
  }
}

// Simulates a live WS feed: ticks the current forming bar every ~1.2s, closes
// it and opens a new one every `timeframe` interval, and randomly drops the
// "connection" every so often to exercise real reconnect/backoff logic —
// the same handler shape a real Bybit WebSocket wrapper will need in Phase 4.
class ReconnectingStream {
  constructor(symbol, timeframe, handlers, seedCandle) {
    this.symbol = symbol;
    this.timeframe = timeframe;
    this.handlers = handlers;
    this._seed = seedCandle;
    this._closed = false;
    this._retryDelay = 1000;
    this._tickTimer = null;
    this._dropTimer = null;
    this._current = null;
    this._connect();
  }
  _connect() {
    if (this._closed) return;
    this.handlers.onStatus('connecting');
    const rand = mulberry32((Date.now() ^ hashStr(this.symbol)) >>> 0);
    setTimeout(() => {
      if (this._closed) return;
      this.handlers.onStatus('connected');
      this._retryDelay = 1000; // reset backoff on a successful connect
      const interval = TF_SECONDS[this.timeframe] || 86400;
      // continue from the real last historical bar (seed) if we have one and
      // it isn't already stale; only fall back to reconstructing from "now"
      // if we're reconnecting later with no seed on hand
      if (this._current === null && this._seed) {
        this._current = { ...this._seed };
      } else if (this._current === null) {
        const info = MOCK_INSTRUMENTS[this.symbol] || MOCK_INSTRUMENTS.DEFAULT;
        this._current = { time: Math.floor(Date.now() / 1000 / interval) * interval, open: info.basePrice, high: info.basePrice, low: info.basePrice, close: info.basePrice };
      }
      this._tickTimer = setInterval(() => this._tick(interval), 1200);
      // simulate an occasional dropped connection, 45-90s apart
      this._dropTimer = setTimeout(() => this._simulateDrop(), 45000 + rand() * 45000);
    }, 500 + rand() * 500);
  }
  _tick(interval) {
    if (this._closed || !this._current) return;
    const nowBar = Math.floor(Date.now() / 1000 / interval) * interval;
    const isNewBar = nowBar !== this._current.time;
    const rand = Math.random();
    const move = this._current.close * 0.0015 * (rand - 0.5) * 2;
    if (isNewBar) {
      this._current = { time: nowBar, open: this._current.close, high: this._current.close, low: this._current.close, close: this._current.close + move };
    } else {
      this._current.close = Math.max(0.0001, this._current.close + move);
      this._current.high = Math.max(this._current.high, this._current.close);
      this._current.low = Math.min(this._current.low, this._current.close);
    }
    this.handlers.onCandle({ ...this._current }, isNewBar);
  }
  _simulateDrop() {
    if (this._closed) return;
    clearInterval(this._tickTimer);
    this.handlers.onStatus('disconnected');
    setTimeout(() => {
      if (this._closed) return;
      this._retryDelay = Math.min(this._retryDelay * 2, 16000); // exponential backoff, capped
      this._connect();
    }, this._retryDelay);
  }
  close() {
    this._closed = true;
    clearInterval(this._tickTimer);
    clearTimeout(this._dropTimer);
  }
}

/* ============================================================
   2b. BYBIT DATA SOURCE — real public market data (no auth needed)
   ------------------------------------------------------------
   Implements the exact same 3-method interface as MockDataSource,
   so nothing above this layer needs to know which one is active.
   Falls back to mock data automatically (with a clear debug message)
   if a fetch fails — CORS, network, symbol not found, etc.
   ============================================================ */
const BYBIT_REST_BASE = 'https://api.bybit.com';
const BYBIT_KLINE_INTERVAL = { '1m': '1', '3m': '3', '5m': '5', '15m': '15', '30m': '30', '1h': '60', '4h': '240', '1d': 'D' };

class BybitDataSource {
  constructor() { this._mock = new MockDataSource(); }

  async fetchKlines(symbol, timeframe, limit = 300) {
    try {
      const interval = BYBIT_KLINE_INTERVAL[timeframe];
      const url = `${BYBIT_REST_BASE}/v5/market/kline?category=linear&symbol=${symbol}&interval=${interval}&limit=${limit}`;
      const resp = await fetch(url);
      const json = await resp.json();
      if (json.retCode !== 0) throw new Error(json.retMsg || 'Bybit API error');
      // Bybit returns newest-first: [start, open, high, low, close, volume, turnover]
      const candles = json.result.list.map(k => ({
        time: Math.floor(Number(k[0]) / 1000), open: Number(k[1]), high: Number(k[2]), low: Number(k[3]), close: Number(k[4]),
      })).sort((a, b) => a.time - b.time);
      if (!candles.length) throw new Error('empty kline response');
      return candles;
    } catch (err) {
      console.warn('BybitDataSource.fetchKlines failed, falling back to mock:', err.message);
      return this._mock.fetchKlines(symbol, timeframe, limit);
    }
  }

  async getInstrumentInfo(symbol) {
    try {
      const url = `${BYBIT_REST_BASE}/v5/market/instruments-info?category=linear&symbol=${symbol}`;
      const resp = await fetch(url);
      const json = await resp.json();
      if (json.retCode !== 0 || !json.result.list.length) throw new Error(json.retMsg || 'symbol not found');
      const info = json.result.list[0];
      return {
        tickSize: Number(info.priceFilter.tickSize),
        qtyStep: Number(info.lotSizeFilter.qtyStep),
        minOrderQty: Number(info.lotSizeFilter.minOrderQty),
        maxLeverage: Number(info.leverageFilter.maxLeverage),
        basePrice: undefined, // only used by the mock's own kline generator
      };
    } catch (err) {
      console.warn('BybitDataSource.getInstrumentInfo failed, falling back to mock:', err.message);
      return this._mock.getInstrumentInfo(symbol);
    }
  }

  // Bybit's real streaming path is a public WebSocket
  // (wss://stream.bybit.com/v5/public/linear) — that's a larger, separate
  // piece of wiring (subscribe/ping-pong/resubscribe-on-symbol-change).
  // For now this falls through to the same simulated tick stream the mock
  // uses, layered on top of whatever REAL historical candles were loaded
  // above, so at minimum the chart's history and instrument data are real
  // even before the live WS layer is built out.
  subscribeKlines(symbol, timeframe, handlers, seedCandle) {
    return this._mock.subscribeKlines(symbol, timeframe, handlers, seedCandle);
  }
}

/* ============================================================
   4. TICK-SIZE SNAPPING
   ------------------------------------------------------------
   Bybit rejects orders whose price doesn't land exactly on a tick
   boundary. currentTickSize is set from instrument info whenever the
   symbol changes, and every PnL box price edit snaps to it.
   ============================================================ */
let currentTickSize = 0.01;
function snapToTick(price, tickSize = currentTickSize) {
  if (!tickSize) return price;
  const decimals = (tickSize.toString().split('.')[1] || '').length;
  return parseFloat((Math.round(price / tickSize) * tickSize).toFixed(decimals));
}
function snapToStep(qty, step) {
  if (!step) return qty;
  const decimals = (step.toString().split('.')[1] || '').length;
  // round DOWN to the nearest valid step — never round up on quantity,
  // since that would risk more than the user's stated risk amount
  return parseFloat((Math.floor(qty / step) * step).toFixed(decimals));
}

/* ============================================================
   5. TRADE MATH
   ------------------------------------------------------------
   Pure functions — no network/order calls yet (Phase 4). Confirm
   just logs the computed payload for now.

   Documented assumptions (real, not arbitrary — but worth knowing):
   - Fee rates are Bybit's standard non-VIP USDT perpetual rates as of
     2026: 0.020% maker, 0.055% taker (verified, not from training memory).
   - Entry fee uses the taker rate if the order will fill as Market
     (entry within 0.02% of current price, per spec), otherwise maker
     (resting Limit order).
   - TP exit is modeled as a resting Limit order -> maker fee.
   - SL exit is modeled as a Stop-Market order (Bybit's default SL
     trigger behavior) -> taker fee.
   - Net R:R = (gross reward - entry fee - TP fee) / (gross risk +
     entry fee + SL fee). Fees reduce the win and *add to* the loss,
     since they're paid either way.
   ============================================================ */
const FEE_MAKER = 0.0002;   // 0.020%
const FEE_TAKER = 0.00055;  // 0.055%
const MARKET_THRESHOLD = 0.0002; // 0.02% — within this of current price => Market order
const ENTRY_DEVIATION_LIMIT = 0.10; // 10% — entry must be within this of current price

// Net R:R depends only on entry/tp/sl and whether entry fills Market or
// Limit — quantity cancels out of both numerator and denominator, so this
// same formula drives both the on-chart label and the confirmation modal.
// One shared function means they can never drift apart.
function computeNetRR(entry, tp, sl, currentPrice) {
  const isMarket = Math.abs(entry - currentPrice) / currentPrice <= MARKET_THRESHOLD;
  const entryFeeRate = isMarket ? FEE_TAKER : FEE_MAKER;
  const netReward = Math.abs(tp - entry) - entry * entryFeeRate - tp * FEE_MAKER;
  const netRisk = Math.abs(entry - sl) + entry * entryFeeRate + sl * FEE_TAKER;
  return netRisk > 0 ? netReward / netRisk : 0;
}

// tracks the PnL box trade actions should act on: whichever one is
// currently selected, falling back to whichever was most recently
// created/edited if nothing is selected right now (per spec)
let lastEditedPnLBox = null;
function getActivePnLBox() {
  if (selected instanceof PnLBox) return selected;
  return lastEditedPnLBox;
}

function computeTradeParams(box, side, riskMode, riskValue, balance, currentPrice, instrumentInfo) {
  const { entry, tp, sl } = box;
  const impliedDirection = tp > entry ? 'long' : 'short';
  const directionMismatch = side !== impliedDirection;

  const riskAmount = riskMode === 'usdt' ? riskValue : balance * (riskValue / 100);
  const slDistance = Math.abs(entry - sl);
  const qtyRaw = slDistance > 0 ? riskAmount / slDistance : 0;
  const qty = snapToStep(qtyRaw, instrumentInfo.qtyStep);

  const notional = qty * entry;
  const entryDeviation = Math.abs(entry - currentPrice) / currentPrice;
  const isMarket = entryDeviation <= MARKET_THRESHOLD;
  const orderType = isMarket ? 'Market' : 'Limit';

  const entryFeeRate = isMarket ? FEE_TAKER : FEE_MAKER;
  const entryFee = notional * entryFeeRate;
  const tpFee = qty * tp * FEE_MAKER;   // TP modeled as maker (resting limit)
  const slFee = qty * sl * FEE_TAKER;   // SL modeled as taker (stop-market)

  const grossReward = qty * Math.abs(tp - entry);
  const grossRisk = qty * Math.abs(entry - sl);
  const netReward = grossReward - entryFee - tpFee;
  const netRisk = grossRisk + entryFee + slFee;
  const netRR = computeNetRR(entry, tp, sl, currentPrice); // same formula the chart label uses

  const requiredLeverage = balance > 0 ? notional / balance : Infinity;

  const errors = [];
  if (directionMismatch) errors.push(`Box implies ${impliedDirection.toUpperCase()} (TP is ${tp > entry ? 'above' : 'below'} entry) but you selected ${side.toUpperCase()}.`);
  if (netRR < 2) errors.push(`Net R:R is ${netRR.toFixed(2)} — must be at least 2.00 after fees.`);
  if (qty < instrumentInfo.minOrderQty) errors.push(`Quantity ${qty} is below the exchange minimum of ${instrumentInfo.minOrderQty}.`);
  if (entryDeviation > ENTRY_DEVIATION_LIMIT) errors.push(`Entry is ${(entryDeviation * 100).toFixed(1)}% from market price — must be within ${(ENTRY_DEVIATION_LIMIT * 100).toFixed(0)}%.`);
  if (requiredLeverage > instrumentInfo.maxLeverage) errors.push(`Required leverage ${requiredLeverage.toFixed(1)}x exceeds this symbol's max of ${instrumentInfo.maxLeverage}x.`);

  return {
    symbol: currentSymbol, side, impliedDirection, directionMismatch,
    entry, tp, sl, qty, notional, orderType, isMarket,
    entryFee, tpFee, slFee, grossReward, grossRisk, netReward, netRisk, netRR,
    riskAmount, requiredLeverage, maxLeverage: instrumentInfo.maxLeverage,
    valid: errors.length === 0, errors,
  };
}

/* ============================================================
   4b. BYBIT ORDER CLIENT
   ------------------------------------------------------------
   Real, correct request construction and HMAC-SHA256 signing per
   Bybit's V5 auth spec — sign string is exactly
   timestamp + apiKey + recvWindow + (queryString | jsonBody).
   This is genuinely correct code, not a stub — but it only ever
   reaches the network if BOTH an API key and secret are set. With
   no keys (the default here, per design), every call is simulated:
   the real request is fully constructed and logged so you can see
   exactly what would be sent, then a response shaped like Bybit's
   real envelope ({retCode, retMsg, result, retExtInfo, time}) is
   returned instead of actually dispatching it.
   ============================================================ */
async function hmacSha256Hex(message, secret) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
}

class BybitOrderClient {
  constructor({ apiKey = '', apiSecret = '', testnet = true } = {}) {
    this.apiKey = apiKey;
    this.apiSecret = apiSecret;
    this.baseUrl = testnet ? 'https://api-testnet.bybit.com' : 'https://api.bybit.com';
    this._mockOrders = []; // in-memory simulated order/fill history, session-only
  }
  get isLive() { return !!(this.apiKey && this.apiSecret); }

  async _request(method, path, params) {
    const timestamp = Date.now().toString();
    const recvWindow = '5000';
    const queryString = new URLSearchParams(params).toString();
    const jsonBody = JSON.stringify(params);
    const payloadForSign = method === 'GET' ? queryString : jsonBody;
    const signString = timestamp + this.apiKey + recvWindow + payloadForSign;

    if (!this.isLive) {
      const signature = await hmacSha256Hex(signString, 'SIMULATED_SECRET_PLACEHOLDER');
      console.log('[SIMULATED — no API key/secret set]', {
        method, url: `${this.baseUrl}${path}`, params,
        headers: { 'X-BAPI-API-KEY': '(not set)', 'X-BAPI-TIMESTAMP': timestamp, 'X-BAPI-RECV-WINDOW': recvWindow, 'X-BAPI-SIGN': signature.slice(0, 12) + '…' },
      });
      return this._mockResponse(path, params);
    }

    const signature = await hmacSha256Hex(signString, this.apiSecret);
    const headers = {
      'X-BAPI-API-KEY': this.apiKey, 'X-BAPI-TIMESTAMP': timestamp,
      'X-BAPI-RECV-WINDOW': recvWindow, 'X-BAPI-SIGN': signature, 'Content-Type': 'application/json',
    };
    const url = method === 'GET' ? `${this.baseUrl}${path}?${queryString}` : `${this.baseUrl}${path}`;
    const resp = await fetch(url, { method, headers, body: method === 'GET' ? undefined : jsonBody });
    return await resp.json();
  }

  // Simulates the order actually filling and later closing (TP or SL hit) a
  // few seconds after confirmation, so the reconciliation loop below has a
  // real Filled record to find — without this, simulation mode would leave
  // the journal permanently empty and untestable.
  _simulateFill(orderId, p) {
    const record = { orderId, symbol: p.symbol, side: p.side, qty: p.qty, entry: p.entry, status: 'New', closePrice: null, realizedPnl: null, filledAt: null };
    this._mockOrders.push(record);
    setTimeout(() => {
      const win = Math.random() < 0.6; // simulated outcome only — every confirmed setup already passed Net R:R >= 2
      record.status = 'Filled';
      record.closePrice = win ? p.tp : p.sl;
      const priceDelta = p.side === 'long' ? (record.closePrice - p.entry) : (p.entry - record.closePrice);
      record.realizedPnl = priceDelta * p.qty; // simplified for the mock — a live fill would report Bybit's own net-of-fees figure
      record.filledAt = Date.now();
    }, 4000 + Math.random() * 4000);
  }

  _mockResponse(path, params) {
    const time = Date.now();
    if (path === '/v5/order/create') {
      return { retCode: 0, retMsg: 'OK', result: { orderId: 'SIM-' + time, orderLinkId: '' }, retExtInfo: {}, time };
    }
    if (path === '/v5/account/wallet-balance') {
      return { retCode: 0, retMsg: 'OK', result: { list: [{ totalAvailableBalance: String(mockBalance), coin: [] }] }, retExtInfo: {}, time };
    }
    if (path === '/v5/position/set-leverage') {
      return { retCode: 0, retMsg: 'OK', result: {}, retExtInfo: {}, time };
    }
    if (path === '/v5/order/history') {
      const list = this._mockOrders
        .filter(o => o.status === 'Filled' && (!params.symbol || o.symbol === params.symbol))
        .map(o => ({
          orderId: o.orderId, symbol: o.symbol, side: o.side === 'long' ? 'Buy' : 'Sell', qty: String(o.qty),
          avgPrice: String(o.entry), orderStatus: 'Filled', closePrice: String(o.closePrice),
          realizedPnl: String(o.realizedPnl.toFixed(4)), updatedTime: String(o.filledAt),
        }));
      return { retCode: 0, retMsg: 'OK', result: { list }, retExtInfo: {}, time };
    }
    return { retCode: 0, retMsg: 'OK (simulated)', result: {}, retExtInfo: {}, time };
  }

  // category='linear' = USDT perpetuals, matching everything else in this app
  createOrder(p) {
    const promise = this._request('POST', '/v5/order/create', {
      category: 'linear', symbol: p.symbol, side: p.side === 'long' ? 'Buy' : 'Sell',
      orderType: p.orderType, qty: String(p.qty),
      price: p.orderType === 'Limit' ? String(p.entry) : undefined,
      takeProfit: String(p.tp), stopLoss: String(p.sl),
      timeInForce: p.orderType === 'Limit' ? 'GTC' : 'IOC',
    });
    if (!this.isLive) promise.then(resp => { if (resp.retCode === 0) this._simulateFill(resp.result.orderId, p); });
    return promise;
  }
  setLeverage(symbol, leverage) {
    return this._request('POST', '/v5/position/set-leverage', {
      category: 'linear', symbol, buyLeverage: String(leverage), sellLeverage: String(leverage),
    });
  }
  getWalletBalance(accountType = 'UNIFIED') {
    return this._request('GET', '/v5/account/wallet-balance', { accountType });
  }
  getOrderHistory(symbol, limit = 50) {
    return this._request('GET', '/v5/order/history', { category: 'linear', symbol, limit });
  }
}

// lightweight-charts' coordinateToTime()/coordinateToLogical() only resolve
// coordinates where an actual bar exists — they return null past the last
// real candle regardless of rightOffset (that only reserves visual margin,
// it doesn't make the area time-addressable). The library's own documented
// fix is WhitespaceData: time-only points with no OHLC, appended after the
// real data, which makes that future range genuinely interactive.
const FUTURE_WHITESPACE_BARS = 60;
function appendFutureWhitespace(data, n) {
  if (data.length < 2) return data;
  const interval = data[data.length - 1].time - data[data.length - 2].time;
  let t = data[data.length - 1].time;
  const extended = data.slice();
  for (let i = 0; i < n; i++) {
    t += interval;
    extended.push({ time: t }); // no open/high/low/close = whitespace point
  }
  return extended;
}

let chartData = []; // real candles + trailing future-whitespace points, kept in sync with the series

// series.update() requires the new point's time to be >= the series' last
// existing point — but our series always ends with future whitespace points
// (deliberately, for the future-drawing feature), so a live tick at the
// *current* real time is always earlier than that and update() throws. We
// splice the live candle into the real-data prefix instead and re-set.
function applyLiveCandle(candle, isNewBar) {
  let realEnd = 0;
  while (realEnd < chartData.length && chartData[realEnd].open !== undefined) realEnd++;
  if (isNewBar) {
    // the first whitespace slot's time is always exactly last-real-time +
    // interval — i.e. it was already reserved for precisely this new bar.
    // Overwrite it in place rather than inserting, which would leave a
    // duplicate/out-of-order timestamp sitting right next to it.
    if (realEnd < chartData.length) chartData[realEnd] = candle;
    else chartData.push(candle); // no whitespace left (shouldn't normally happen)
  } else if (realEnd > 0) {
    chartData[realEnd - 1] = candle; // update the still-forming last real candle in place
  } else {
    chartData.unshift(candle);
  }
  series.setData(chartData);
}

// switchSymbolDrawings is defined later (near primitive management) and

  try {
    const [klines, info] = await Promise.all([
      dataSource.fetchKlines(symbol, timeframe, 300),
      dataSource.getInstrumentInfo(symbol),
    ]);
    currentTickSize = info.tickSize;
    chartData = appendFutureWhitespace(klines, FUTURE_WHITESPACE_BARS);
    series.setData(chartData);
    chart.timeScale().fitContent();
    computeBarInterval(chartData);

    currentSymbol = symbol;
    currentTimeframe = timeframe;
    symbolNameEl.value = symbol;
    lastDisplayedPrice = null;
    updateLastPrice(klines[klines.length - 1].close);

    document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === timeframe));
    // only reload drawings if the symbol actually changed — a timeframe-only
    // switch has no reason to detach/reattach the same symbol's drawings
    if (symbol !== previousSymbol && typeof switchSymbolDrawings === 'function') switchSymbolDrawings(symbol);

    activeStream = dataSource.subscribeKlines(symbol, timeframe, {
      onCandle: (candle, isNewBar) => { applyLiveCandle(candle, isNewBar); updateLastPrice(candle.close); },
      onStatus: (status) => {
        connStatusEl.className = status;
        connStatusEl.title = status === 'connected' ? 'Live' : status === 'connecting' ? 'Connecting…' : 'Disconnected — retrying…';
      },
    }, klines[klines.length - 1]);

    const realCandles = chartData.filter(d => d.open !== undefined).length;
    setDebug(`OK — ${symbol} ${timeframe}, ${realCandles} candles + ${FUTURE_WHITESPACE_BARS} future slots, container ${container.clientWidth}x${container.clientHeight}px${STORAGE_WORKS ? '' : ' — ⚠ localStorage unavailable, drawings/settings will not persist here'}`, !STORAGE_WORKS);
  } catch (err) {
    setDebug('Data load failed: ' + err.message, true);
    console.error('Data load failed', err);
  }
}

new ResizeObserver(entries => {
  const { width, height } = entries[0].contentRect;
  chart.resize(width, height);
}).observe(container);

/* ============================================================
   3. GEOMETRY HELPER
   ============================================================ */
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t * dx, cy = y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}

/* ============================================================
   3. BASE CLASS — shared plumbing for every draggable primitive
   ============================================================ */
class DraggablePrimitive {
  constructor() {
    this.selected = false;
    this._chart = null;
    this._series = null;
    this._requestUpdate = null;
    this._paneView = { renderer: () => ({ draw: (target) => this.draw(target) }) };
  }
  attached(param) {
    this._chart = param.chart;
    this._series = param.series;
    this._requestUpdate = param.requestUpdate;
  }
  detached() {}
  updateAllViews() {}
  paneViews() { return [this._paneView]; }
  refresh() { if (this._requestUpdate) this._requestUpdate(); }
  // override in subclasses:
  draw(target) {}
  hitTest(x, y) { return null; }
  beginDrag(handle, x, y) {}
  drag(handle, x, y) {}
  endDrag() {}
}

/* ============================================================
   4. TRENDLINE
   ============================================================ */
class TrendLine extends DraggablePrimitive {
  constructor(p1, p2, color = '#2962ff') {
    super();
    this.p1 = p1; this.p2 = p2; this.color = color;
    this._dragOrigin = null;
  }
  draw(target) {
    const x1 = timeToX(this.p1.time), y1 = priceToY(this.p1.price);
    const x2 = timeToX(this.p2.time), y2 = priceToY(this.p2.price);
    if (x1 === null || y1 === null || x2 === null || y2 === null) return;
    target.useBitmapCoordinateSpace(scope => {
      const ctx = scope.context;
      ctx.save();
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2 * scope.horizontalPixelRatio;
      ctx.beginPath();
      ctx.moveTo(bitX(scope, x1), bitY(scope, y1));
      ctx.lineTo(bitX(scope, x2), bitY(scope, y2));
      ctx.stroke();
      if (this.selected) {
        [[x1, y1], [x2, y2]].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(bitX(scope, x), bitY(scope, y), HANDLE_R * scope.horizontalPixelRatio, 0, Math.PI * 2);
          ctx.fillStyle = '#131722';
          ctx.fill();
          ctx.lineWidth = 2 * scope.horizontalPixelRatio;
          ctx.strokeStyle = this.color;
          ctx.stroke();
        });
      }
      ctx.restore();
    });
  }
  hitTest(x, y) {
    const x1 = timeToX(this.p1.time), y1 = priceToY(this.p1.price);
    const x2 = timeToX(this.p2.time), y2 = priceToY(this.p2.price);
    if (x1 === null || y1 === null || x2 === null || y2 === null) return null;
    if (Math.hypot(x - x1, y - y1) <= HANDLE_R + HIT_TOL) return 'p1';
    if (Math.hypot(x - x2, y - y2) <= HANDLE_R + HIT_TOL) return 'p2';
    if (distToSegment(x, y, x1, y1, x2, y2) <= HIT_TOL) return 'body';
    return null;
  }
  beginDrag(handle, x, y) {
    if (handle === 'body') {
      this._dragOrigin = {
        startX: x, startY: y,
        p1x: timeToX(this.p1.time), p1y: priceToY(this.p1.price),
        p2x: timeToX(this.p2.time), p2y: priceToY(this.p2.price),
      };
    }
  }
  drag(handle, x, y) {
    if (handle === 'p1') { this.p1 = { time: xToTime(x) ?? this.p1.time, price: yToPrice(y) ?? this.p1.price }; }
    else if (handle === 'p2') { this.p2 = { time: xToTime(x) ?? this.p2.time, price: yToPrice(y) ?? this.p2.price }; }
    else if (handle === 'body' && this._dragOrigin) {
      const o = this._dragOrigin;
      const dx = x - o.startX, dy = y - o.startY;
      const t1 = xToTime(o.p1x + dx), pr1 = yToPrice(o.p1y + dy);
      const t2 = xToTime(o.p2x + dx), pr2 = yToPrice(o.p2y + dy);
      if (t1 !== null && pr1 !== null) this.p1 = { time: t1, price: pr1 };
      if (t2 !== null && pr2 !== null) this.p2 = { time: t2, price: pr2 };
    }
    this.refresh();
  }
  endDrag() { this._dragOrigin = null; }
}

/* ============================================================
   5. BOX
   ============================================================ */
class BoxDrawing extends DraggablePrimitive {
  constructor(p1, p2, color = '#2962ff') {
    super();
    this.p1 = p1; this.p2 = p2; this.color = color; // p1/p2 = any two opposite corners
    this._dragOrigin = null;
  }
  draw(target) {
    const x1 = timeToX(this.p1.time), y1 = priceToY(this.p1.price);
    const x2 = timeToX(this.p2.time), y2 = priceToY(this.p2.price);
    if (x1 === null || y1 === null || x2 === null || y2 === null) return;
    target.useBitmapCoordinateSpace(scope => {
      const ctx = scope.context;
      const bx1 = bitX(scope, Math.min(x1, x2)), bx2 = bitX(scope, Math.max(x1, x2));
      const by1 = bitY(scope, Math.min(y1, y2)), by2 = bitY(scope, Math.max(y1, y2));
      ctx.save();
      ctx.fillStyle = this.color + '2A';
      ctx.fillRect(bx1, by1, bx2 - bx1, by2 - by1);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 1.5 * scope.horizontalPixelRatio;
      ctx.strokeRect(bx1, by1, bx2 - bx1, by2 - by1);
      if (this.selected) {
        [[x1, y1], [x1, y2], [x2, y1], [x2, y2]].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(bitX(scope, x), bitY(scope, y), HANDLE_R * scope.horizontalPixelRatio, 0, Math.PI * 2);
          ctx.fillStyle = '#131722'; ctx.fill();
          ctx.strokeStyle = this.color; ctx.lineWidth = 2 * scope.horizontalPixelRatio; ctx.stroke();
        });
      }
      ctx.restore();
    });
  }
  hitTest(x, y) {
    const x1 = timeToX(this.p1.time), y1 = priceToY(this.p1.price);
    const x2 = timeToX(this.p2.time), y2 = priceToY(this.p2.price);
    if (x1 === null || y1 === null || x2 === null || y2 === null) return null;
    const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
    const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
    if (Math.hypot(x - x1, y - y1) <= HANDLE_R + HIT_TOL) return 'p1';
    if (Math.hypot(x - x2, y - y2) <= HANDLE_R + HIT_TOL) return 'p2';
    if (Math.hypot(x - x1, y - y2) <= HANDLE_R + HIT_TOL) return 'p1y2';
    if (Math.hypot(x - x2, y - y1) <= HANDLE_R + HIT_TOL) return 'p2y1';
    if (x >= minX && x <= maxX && y >= minY && y <= maxY) return 'body';
    return null;
  }
  beginDrag(handle, x, y) {
    if (handle === 'body') {
      this._dragOrigin = {
        startX: x, startY: y,
        p1x: timeToX(this.p1.time), p1y: priceToY(this.p1.price),
        p2x: timeToX(this.p2.time), p2y: priceToY(this.p2.price),
      };
    }
  }
  drag(handle, x, y) {
    if (handle === 'p1') this.p1 = { time: xToTime(x) ?? this.p1.time, price: yToPrice(y) ?? this.p1.price };
    else if (handle === 'p2') this.p2 = { time: xToTime(x) ?? this.p2.time, price: yToPrice(y) ?? this.p2.price };
    else if (handle === 'p1y2') { // top-right / bottom-left cross corner: x from p1, y from p2
      const t = xToTime(x); if (t !== null) this.p1 = { ...this.p1, time: t };
      const pr = yToPrice(y); if (pr !== null) this.p2 = { ...this.p2, price: pr };
    } else if (handle === 'p2y1') {
      const t = xToTime(x); if (t !== null) this.p2 = { ...this.p2, time: t };
      const pr = yToPrice(y); if (pr !== null) this.p1 = { ...this.p1, price: pr };
    } else if (handle === 'body' && this._dragOrigin) {
      const o = this._dragOrigin;
      const dx = x - o.startX, dy = y - o.startY;
      const t1 = xToTime(o.p1x + dx), pr1 = yToPrice(o.p1y + dy);
      const t2 = xToTime(o.p2x + dx), pr2 = yToPrice(o.p2y + dy);
      if (t1 !== null && pr1 !== null) this.p1 = { time: t1, price: pr1 };
      if (t2 !== null && pr2 !== null) this.p2 = { time: t2, price: pr2 };
    }
    this.refresh();
  }
  endDrag() { this._dragOrigin = null; }
}

/* ============================================================
   6. PNL BOX — entry / tp / sl lines + green/red zones, fully adjustable
   ============================================================ */
class PnLBox extends DraggablePrimitive {
  constructor(entryTime, entryTime2, entryPrice, tpPrice, slPrice) {
    super();
    this.t1 = entryTime;      // left edge
    this.t2 = entryTime2;     // right edge
    this.entry = entryPrice;
    this.tp = tpPrice;
    this.sl = slPrice;
    this._dragOrigin = null;
  }
  draw(target) {
    const xL = timeToX(this.t1), xR = timeToX(this.t2);
    const yE = priceToY(this.entry), yTp = priceToY(this.tp), ySl = priceToY(this.sl);
    if ([xL, xR, yE, yTp, ySl].some(v => v === null)) return;
    target.useBitmapCoordinateSpace(scope => {
      const ctx = scope.context;
      const bxL = bitX(scope, Math.min(xL, xR)), bxR = bitX(scope, Math.max(xL, xR));
      ctx.save();
      // green (win) zone: entry -> tp
      ctx.fillStyle = 'rgba(38,166,154,0.22)';
      ctx.fillRect(bxL, bitY(scope, Math.min(yE, yTp)), bxR - bxL, Math.abs(bitY(scope, yTp) - bitY(scope, yE)));
      // red (loss) zone: entry -> sl
      ctx.fillStyle = 'rgba(239,83,80,0.22)';
      ctx.fillRect(bxL, bitY(scope, Math.min(yE, ySl)), bxR - bxL, Math.abs(bitY(scope, ySl) - bitY(scope, yE)));

      const drawLine = (y, color, dashed) => {
        ctx.beginPath();
        ctx.setLineDash(dashed ? [6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio] : []);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5 * scope.verticalPixelRatio;
        ctx.moveTo(bxL, bitY(scope, y));
        ctx.lineTo(bxR, bitY(scope, y));
        ctx.stroke();
        ctx.setLineDash([]);
      };
      drawLine(this.entry, '#d1d4dc', false);
      drawLine(this.tp, '#26a69a', true);
      drawLine(this.sl, '#ef5350', true);

      // Net R:R (fee-adjusted) — same formula the confirmation modal uses,
      // so you can size the box correctly before ever opening it. Falls
      // back to the current entry price if no live tick has arrived yet.
      ctx.font = `${11 * scope.verticalPixelRatio}px sans-serif`;
      ctx.textBaseline = 'middle';
      const currentPrice = (typeof lastDisplayedPrice !== 'undefined' && lastDisplayedPrice !== null) ? lastDisplayedPrice : this.entry;
      const rr = computeNetRR(this.entry, this.tp, this.sl, currentPrice);

      ctx.fillStyle = rr >= 2 ? '#26a69a' : '#787b86';
      ctx.fillText(`Net R:R 1:${rr.toFixed(2)}`, bxL, bitY(scope, Math.min(yTp, ySl)) - 14 * scope.verticalPixelRatio);

      // handles
      if (this.selected) {
        const dot = (x, y, color) => {
          ctx.beginPath();
          ctx.arc(x, y, HANDLE_R * scope.horizontalPixelRatio, 0, Math.PI * 2);
          ctx.fillStyle = '#131722'; ctx.fill();
          ctx.strokeStyle = color; ctx.lineWidth = 2 * scope.horizontalPixelRatio; ctx.stroke();
        };
        [['entry', this.entry, '#d1d4dc'], ['tp', this.tp, '#26a69a'], ['sl', this.sl, '#ef5350']].forEach(([, y, c]) => {
          dot(bxL, bitY(scope, y), c); dot(bxR, bitY(scope, y), c);
        });
        // left/right edges as real vertical lines spanning the box height —
        // draggable along their whole length, same as the horizontal lines
        const topY = bitY(scope, Math.min(yE, yTp, ySl)), botY = bitY(scope, Math.max(yE, yTp, ySl));
        ctx.strokeStyle = '#2962ff';
        ctx.lineWidth = 1.5 * scope.horizontalPixelRatio;
        ctx.setLineDash([4 * scope.horizontalPixelRatio, 3 * scope.horizontalPixelRatio]);
        [bxL, bxR].forEach(x => {
          ctx.beginPath();
          ctx.moveTo(x, topY);
          ctx.lineTo(x, botY);
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }
      ctx.restore();
    });
  }
  hitTest(x, y) {
    const xL = timeToX(this.t1), xR = timeToX(this.t2);
    const yE = priceToY(this.entry), yTp = priceToY(this.tp), ySl = priceToY(this.sl);
    if ([xL, xR, yE, yTp, ySl].some(v => v === null)) return null;
    const minX = Math.min(xL, xR), maxX = Math.max(xL, xR);
    const inXRange = x >= minX - HIT_TOL && x <= maxX + HIT_TOL;

    // horizontal lines (only within box width)
    if (inXRange) {
      if (Math.abs(y - yE) <= HIT_TOL) return 'entry';
      if (Math.abs(y - yTp) <= HIT_TOL) return 'tp';
      if (Math.abs(y - ySl) <= HIT_TOL) return 'sl';
    }
    // vertical edges
    const minY = Math.min(yE, yTp, ySl), maxY = Math.max(yE, yTp, ySl);
    const inYRange = y >= minY - HIT_TOL && y <= maxY + HIT_TOL;
    if (inYRange) {
      if (Math.abs(x - minX) <= HIT_TOL) return xL <= xR ? 'left' : 'right';
      if (Math.abs(x - maxX) <= HIT_TOL) return xL <= xR ? 'right' : 'left';
    }
    // body
    if (x >= minX && x <= maxX && y >= minY && y <= maxY) return 'body';
    return null;
  }
  beginDrag(handle, x, y) {
    if (handle === 'body') {
      this._dragOrigin = {
        startX: x, startY: y,
        xL: timeToX(this.t1), xR: timeToX(this.t2),
        yE: priceToY(this.entry), yTp: priceToY(this.tp), ySl: priceToY(this.sl),
      };
    }
  }
  drag(handle, x, y) {
    if (handle === 'entry') { const p = yToPrice(y); if (p !== null) this.entry = snapToTick(p); }
    else if (handle === 'tp') { const p = yToPrice(y); if (p !== null) this.tp = snapToTick(p); }
    else if (handle === 'sl') { const p = yToPrice(y); if (p !== null) this.sl = snapToTick(p); }
    else if (handle === 'left') { const t = xToTime(x); if (t !== null) this.t1 = t; }
    else if (handle === 'right') { const t = xToTime(x); if (t !== null) this.t2 = t; }
    else if (handle === 'body' && this._dragOrigin) {
      const o = this._dragOrigin;
      const dx = x - o.startX, dy = y - o.startY;
      const t1 = xToTime(o.xL + dx), t2 = xToTime(o.xR + dx);
      const pe = yToPrice(o.yE + dy), pt = yToPrice(o.yTp + dy), ps = yToPrice(o.ySl + dy);
      if (t1 !== null) this.t1 = t1;
      if (t2 !== null) this.t2 = t2;
      if (pe !== null) this.entry = snapToTick(pe);
      if (pt !== null) this.tp = snapToTick(pt);
      if (ps !== null) this.sl = snapToTick(ps);
    }
    this.refresh();
  }
  endDrag() { this._dragOrigin = null; }
}

/* ============================================================
   6b. CANDLE COUNTDOWN BADGE
   ------------------------------------------------------------
   A small always-on badge showing time remaining until the current
   bar closes, positioned at the same Y as the live price so it moves
   up/down with it (Bybit-style). Not interactive, not deletable, not
   part of the user-drawn `primitives` array — attached once at
   bootstrap and left alone.
   ============================================================ */
class CandleCountdownBadge {
  constructor() {
    this._chart = null; this._series = null; this._requestUpdate = null;
    this._paneView = { renderer: () => ({ draw: (target) => this.draw(target) }) };
  }
  attached(param) { this._chart = param.chart; this._series = param.series; this._requestUpdate = param.requestUpdate; }
  detached() {}
  updateAllViews() {}
  paneViews() { return [this._paneView]; }
  refresh() { if (this._requestUpdate) this._requestUpdate(); }

  draw(target) {
    if (lastDisplayedPrice === null || !chartData.length) return;
    const y = priceToY(lastDisplayedPrice);
    if (y === null) return;

    let lastRealTime = null;
    for (let i = chartData.length - 1; i >= 0; i--) {
      if (chartData[i].open !== undefined) { lastRealTime = chartData[i].time; break; }
    }
    if (lastRealTime === null) return;

    const interval = barIntervalSeconds || 60;
    const barCloseTime = lastRealTime + interval;
    const remaining = Math.max(0, Math.round(barCloseTime - Date.now() / 1000));
    const mm = Math.floor(remaining / 60), ss = remaining % 60;
    const text = `${mm}:${String(ss).padStart(2, '0')}`;

    target.useBitmapCoordinateSpace(scope => {
      const ctx = scope.context;
      ctx.save();
      ctx.font = `${10 * scope.verticalPixelRatio}px monospace`;
      const paddingX = 5 * scope.horizontalPixelRatio;
      const h = 15 * scope.verticalPixelRatio;
      const w = ctx.measureText(text).width + paddingX * 2;
      // Series primitives drawn via paneViews() render on the main pane's own
      // canvas, which already ends exactly where the price scale begins —
      // it does NOT include that gutter, so no extra width needs subtracting.
      const xRight = scope.bitmapSize.width - 4 * scope.horizontalPixelRatio;
      const yTop = bitY(scope, y) - h - 3 * scope.verticalPixelRatio; // sit just above the native price label, same Y as the price

      ctx.fillStyle = '#1e222d';
      ctx.strokeStyle = '#e6a23c';
      ctx.lineWidth = 1 * scope.horizontalPixelRatio;
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(xRight - w, yTop, w, h, 3 * scope.horizontalPixelRatio); }
      else { ctx.beginPath(); ctx.rect(xRight - w, yTop, w, h); }
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#e6a23c';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'right';
      ctx.fillText(text, xRight - paddingX, yTop + h / 2);
      ctx.textAlign = 'left';
      ctx.restore();
    });
  }
}

/* ============================================================
   7. TOOL / SELECTION / DRAG STATE MANAGEMENT
   ============================================================ */
const primitives = [];
let activeTool = 'cursor';
let selected = null;
let dragging = null;        // { primitive, handle }
let creating = null;        // primitive currently being placed (trendline/box ghost)

const hint = document.getElementById('hint');
const toolButtons = document.querySelectorAll('.tool-btn[data-tool]');

function setTool(tool) {
  activeTool = tool;
  toolButtons.forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  container.style.cursor = tool === 'cursor' ? 'default' : 'crosshair';
  hint.textContent = {
    cursor: 'Click a shape to select it, drag its handles to edit',
    trendline: 'Click to place the start point, click again to finish',
    box: 'Click to place a corner, click again for the opposite corner',
    pnl: 'Click to drop a PnL box at that entry price',
  }[tool];
}
toolButtons.forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

function select(p) {
  if (selected && selected !== p) { selected.selected = false; selected.refresh(); }
  selected = p;
  if (p) { p.selected = true; p.refresh(); }
}
function deselectAll() { if (selected) { selected.selected = false; selected.refresh(); selected = null; } }

function addPrimitive(p) {
  primitives.push(p);
  series.attachPrimitive(p);
  return p;
}
function removePrimitive(p) {
  const i = primitives.indexOf(p);
  if (i >= 0) primitives.splice(i, 1);
  series.detachPrimitive(p);
  if (selected === p) selected = null;
}

// swaps out every on-chart drawing for the ones persisted under the new
// symbol — called by loadSymbol() whenever the symbol changes
function switchSymbolDrawings(symbol) {
  [...primitives].forEach(removePrimitive);
  loadDrawings(symbol).forEach(addPrimitive);
}

document.getElementById('deleteBtn').addEventListener('click', () => {
  if (selected) { removePrimitive(selected); saveDrawings(currentSymbol); }
});
document.getElementById('clearBtn').addEventListener('click', () => {
  [...primitives].forEach(removePrimitive);
  saveDrawings(currentSymbol);
});

/* ---- pointer handling (mouse + touch) on the chart's own container ----
   Shared logic lives in handlePointerDown/Move/Up; mouse and touch events
   both funnel through them.

   Chart lock strategy: selecting a shape does NOT lock the chart — you can
   still pan/zoom freely with one selected. The chart is only locked for the
   exact duration of an active drag (handle grab or tool creation), then
   unlocked immediately on release. This is done by directly toggling the
   library's own handleScroll/handleScale options rather than relying on
   preventDefault()/event order, which isn't reliable against the library's
   internal touch handlers on its own canvas. */
function setChartInteractive(enabled) {
  chart.applyOptions({
    handleScroll: enabled,
    handleScale: enabled ? { axisPressedMouseMove: { time: true, price: false }, pinch: true, mouseWheel: true, axisDoubleClickReset: true } : false,
  });
}

function getXY(clientX, clientY) {
  const rect = container.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function handlePointerDown(x, y, evt) {
  if (activeTool === 'cursor') {
    for (let i = primitives.length - 1; i >= 0; i--) {
      const hit = primitives[i].hitTest(x, y);
      if (hit) {
        if (primitives[i] !== selected) {
          // first touch on an unselected shape: select it only — do NOT
          // start a drag or block the gesture, so the chart still pans/zooms
          // normally underneath this same touch. You have to tap it once
          // (making it selected) before a second touch can actually move it.
          select(primitives[i]);
          return;
        }
        // already selected — this touch is a real drag
        dragging = { primitive: primitives[i], handle: hit };
        primitives[i].beginDrag(hit, x, y);
        setChartInteractive(false); // lock pan/zoom only now, for the duration of this drag
        if (evt) evt.preventDefault();
        return;
      }
    }
    deselectAll();
    return;
  }

  // creation modes (discrete tap-to-place, not a held drag) — chart stays
  // interactive between the two taps, e.g. so you can pan to a distant point
  if (evt) evt.preventDefault();
  const time = xToTime(x), price = yToPrice(y);
  if (time === null || price === null) {
    console.warn('Could not place point: xToTime/yToPrice returned null', { x, y, time, price });
    return;
  }

  if (activeTool === 'trendline') {
    if (!creating) {
      creating = addPrimitive(new TrendLine({ time, price }, { time, price }));
    } else {
      creating.p2 = { time, price };
      creating.refresh();
      creating = null;
      setTool('cursor');
      saveDrawings(currentSymbol);
    }
  } else if (activeTool === 'box') {
    if (!creating) {
      creating = addPrimitive(new BoxDrawing({ time, price }, { time, price }));
    } else {
      creating.p2 = { time, price };
      creating.refresh();
      creating = null;
      setTool('cursor');
      saveDrawings(currentSymbol);
    }
  } else if (activeTool === 'pnl') {
    const PNL_BOX_PIXEL_WIDTH = 90; // constant on-screen size at any zoom level
    const t2 = addPixels(x, PNL_BOX_PIXEL_WIDTH) ?? time; // ?? only hits if the chart has zero data at all
    const snappedEntry = snapToTick(price);
    const s = loadSettings();
    const tpPct = (s.defaultTpPct ?? 2.0) / 100;
    const slPct = (s.defaultSlPct ?? 1.0) / 100;
    const box = addPrimitive(new PnLBox(time, t2, snappedEntry, snapToTick(price * (1 + tpPct)), snapToTick(price * (1 - slPct))));
    lastEditedPnLBox = box;
    select(box);
    setTool('cursor');
    saveDrawings(currentSymbol);
  }
}

function handlePointerMove(x, y, evt) {
  if (dragging) {
    if (evt) evt.preventDefault();
    dragging.primitive.drag(dragging.handle, x, y);
    return;
  }
  if (creating) {
    if (evt) evt.preventDefault();
    const time = xToTime(x), price = yToPrice(y);
    if (time !== null && price !== null) {
      creating.p2 = { time, price };
      creating.refresh();
    }
    return;
  }
  // hover feedback in cursor mode (mouse only — touch has no hover state)
  if (activeTool === 'cursor') {
    let hovering = null;
    for (let i = primitives.length - 1; i >= 0 && !hovering; i--) {
      hovering = primitives[i].hitTest(x, y);
    }
    container.style.cursor = hovering ? (hovering === 'body' ? 'move' : 'pointer') : 'default';
  }
}

function handlePointerUp() {
  if (dragging) {
    dragging.primitive.endDrag();
    if (dragging.primitive instanceof PnLBox) lastEditedPnLBox = dragging.primitive;
    dragging = null;
    setChartInteractive(true); // release the lock the instant the drag ends
    saveDrawings(currentSymbol);
  }
}


// mouse
container.addEventListener('mousedown', (e) => {
  const { x, y } = getXY(e.clientX, e.clientY);
  handlePointerDown(x, y, e);
});
window.addEventListener('mousemove', (e) => {
  const { x, y } = getXY(e.clientX, e.clientY);
  handlePointerMove(x, y, e);
});
window.addEventListener('mouseup', handlePointerUp);

// touch — { passive: false } is required so preventDefault() is allowed to work
container.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  if (!t) return;
  const { x, y } = getXY(t.clientX, t.clientY);
  handlePointerDown(x, y, e);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  if (!t) return;
  const { x, y } = getXY(t.clientX, t.clientY);
  handlePointerMove(x, y, e);
}, { passive: false });

window.addEventListener('touchend', handlePointerUp, { passive: false });
window.addEventListener('touchcancel', handlePointerUp, { passive: false });

setTool('cursor');

/* ============================================================
   8. RISK PANEL & CONFIRMATION MODAL
   ------------------------------------------------------------
   Confirm now goes through the real, correctly-signed BybitOrderClient —
   it just has no live keys by default, so every call simulates.
   ============================================================ */
let mockBalance = savedSettings.mockBalance ?? 10000; // used both as the simulated balance and the fallback display
async function refreshBalanceDisplay() {
  try {
    const resp = await orderClient.getWalletBalance();
    if (resp.retCode === 0 && resp.result.list?.length) {
      const bal = Number(resp.result.list[0].totalAvailableBalance);
      document.getElementById('balanceValue').textContent = bal.toFixed(2) + ' USDT';
      document.getElementById('simBadge').style.display = orderClient.isLive ? 'none' : '';
      if (orderClient.isLive) mockBalance = bal; // keep risk math consistent with whatever's actually displayed
      return;
    }
  } catch (err) { console.warn('refreshBalanceDisplay failed:', err); }
  document.getElementById('balanceValue').textContent = mockBalance.toFixed(2) + ' USDT';
}
refreshBalanceDisplay();

let riskMode = savedSettings.riskMode || 'usdt';
let riskValue = savedSettings.riskValue ?? 1;
document.getElementById('riskValueInput').value = riskValue;

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    riskMode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    saveSettings({ riskMode });
  });
});
document.getElementById('riskValueInput').addEventListener('change', (e) => {
  riskValue = parseFloat(e.target.value) || 0;
  saveSettings({ riskValue });
});

const modalOverlay = document.getElementById('modalOverlay');
const modalBody = document.getElementById('modalBody');
const modalConfirm = document.getElementById('modalConfirm');
let pendingTrade = null;

function closeModal() { modalOverlay.classList.remove('open'); pendingTrade = null; }

async function openConfirmModal(side) {
  const box = getActivePnLBox();
  if (!box) {
    setDebug('No PnL box selected — draw or select one first.', true);
    return;
  }
  const info = await dataSource.getInstrumentInfo(currentSymbol);
  const currentPrice = lastDisplayedPrice ?? box.entry; // fall back if no tick has arrived yet
  pendingTrade = computeTradeParams(box, side, riskMode, riskValue, mockBalance, currentPrice, info);
  renderModal(pendingTrade);
  modalOverlay.classList.add('open');
}

function renderModal(p) {
  document.getElementById('modalTitle').textContent = `Confirm ${p.side.toUpperCase()} — ${p.orderType}`;
  const row = (k, v, cls) => `<div class="row"><span class="k">${k}</span><span class="v${cls ? ' ' + cls : ''}">${v}</span></div>`;
  let html = '';
  html += row('Symbol', p.symbol);
  html += row('Side', p.side.toUpperCase(), p.side);
  html += row('Order Type', p.orderType);
  html += row('Quantity', p.qty);
  html += row('Notional', p.notional.toFixed(2) + ' USDT');
  html += row('Risking', p.riskAmount.toFixed(2) + ' USDT');
  html += row('Net R:R', '1 : ' + p.netRR.toFixed(2));
  html += row('Fees (Entry/TP/SL)', `${p.entryFee.toFixed(2)} / ${p.tpFee.toFixed(2)} / ${p.slFee.toFixed(2)}`);
  html += row('Leverage', p.requiredLeverage.toFixed(1) + 'x (max ' + p.maxLeverage + 'x)');
  if (p.errors.length) html += '<div class="warn">' + p.errors.map(e => '⚠ ' + e).join('<br>') + '</div>';
  modalBody.innerHTML = html;
  modalConfirm.disabled = !p.valid;
  modalConfirm.textContent = 'Confirm';
}

document.getElementById('longBtn').addEventListener('click', () => openConfirmModal('long'));
document.getElementById('shortBtn').addEventListener('click', () => openConfirmModal('short'));
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalConfirm').addEventListener('click', async () => {
  if (!pendingTrade || !pendingTrade.valid) return;
  const p = pendingTrade;
  modalConfirm.disabled = true;
  modalConfirm.textContent = 'Placing…';
  try {
    // required leverage gets set BEFORE the order per spec, then injected via the order's implicit leverage
    const levResp = await orderClient.setLeverage(p.symbol, Math.ceil(p.requiredLeverage));
    if (levResp.retCode !== 0) throw new Error('setLeverage: ' + levResp.retMsg);
    const orderResp = await orderClient.createOrder(p);
    if (orderResp.retCode !== 0) throw new Error('createOrder: ' + orderResp.retMsg);
    const mode = orderClient.isLive ? 'LIVE' : 'SIMULATED';
    console.log(`[${mode} ORDER PLACED]`, { params: p, orderId: orderResp.result.orderId });
    setDebug(`${mode}: ${p.side.toUpperCase()} order ${orderResp.result.orderId} placed for ${p.symbol}.`);
    closeModal();
  } catch (err) {
    console.error('Order placement failed:', err);
    setDebug('Order failed: ' + err.message, true);
    modalConfirm.disabled = false;
    modalConfirm.textContent = 'Confirm';
  }
});

/* ============================================================
   9. TRADE JOURNAL
   ------------------------------------------------------------
   Entries only ever get created once Bybit (real or simulated)
   reports an order as Filled — nothing pending/unfilled appears
   here. Reconciled on load and periodically thereafter.
   ============================================================ */
function loadJournal() {
  try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'journal') || '[]'); }
  catch (err) { console.warn('loadJournal failed', err); return []; }
}
function saveJournal(list) {
  try { localStorage.setItem(STORAGE_PREFIX + 'journal', JSON.stringify(list)); }
  catch (err) { console.warn('saveJournal failed', err); }
}

async function reconcileJournal() {
  try {
    const resp = await orderClient.getOrderHistory(currentSymbol);
    if (resp.retCode !== 0) return;
    const journal = loadJournal();
    const existingIds = new Set(journal.map(j => j.orderId));
    let added = false;
    for (const o of resp.result.list) {
      if (o.orderStatus === 'Filled' && !existingIds.has(o.orderId)) {
        journal.unshift({
          orderId: o.orderId, symbol: o.symbol, side: o.side === 'Buy' ? 'long' : 'short',
          qty: Number(o.qty), entry: Number(o.avgPrice), closePrice: Number(o.closePrice),
          realizedPnl: Number(o.realizedPnl), closedAt: Number(o.updatedTime),
        });
        added = true;
      }
    }
    if (added) saveJournal(journal);
  } catch (err) { console.warn('reconcileJournal failed', err); }
}

function renderJournal() {
  const journal = loadJournal();
  const body = document.getElementById('journalBody');
  if (!journal.length) { body.innerHTML = '<div class="journal-empty">No filled trades yet.</div>'; return; }
  body.innerHTML = journal.map(j => {
    const win = j.realizedPnl >= 0;
    const date = new Date(j.closedAt).toLocaleString();
    return `<div class="journal-entry">
      <div class="je-main">
        <span class="je-symbol">${j.symbol} · ${j.side.toUpperCase()}</span>
        <span class="je-detail">${j.entry.toFixed(2)} → ${j.closePrice.toFixed(2)} · qty ${j.qty} · ${date}</span>
      </div>
      <span class="je-pnl ${win ? 'win' : 'loss'}">${win ? '+' : ''}${j.realizedPnl.toFixed(2)}</span>
    </div>`;
  }).join('');
}

document.getElementById('journalBtn').addEventListener('click', async () => {
  await reconcileJournal();
  renderJournal();
  document.getElementById('journalOverlay').classList.add('open');
});
document.getElementById('journalClose').addEventListener('click', () => {
  document.getElementById('journalOverlay').classList.remove('open');
});

// reconcile on launch and periodically thereafter, per spec
reconcileJournal();
setInterval(reconcileJournal, 15000);

/* ============================================================
   10. SETTINGS MODAL
   ============================================================ */
const settingsOverlay = document.getElementById('settingsOverlay');
let settingsRiskMode = riskMode; // local staged copy until Save is pressed

// #chart-container already fills 100% of the fixed viewport via flex:1 — it's
// the only flexible element, so it's already at its natural maximum within
// one screen. The only way to make it genuinely *bigger* is to let the whole
// page grow taller than one viewport and scroll. With no scale set (the
// default), nothing here runs and behavior is pixel-identical to before.
function applyChartHeightScale(scale) {
  const appEl = document.getElementById('app');
  if (scale === null || scale === undefined || isNaN(scale)) {
    container.style.minHeight = '';
    appEl.style.height = '';
    appEl.style.minHeight = '';
    document.body.style.overflowY = '';
    document.documentElement.style.overflowY = '';
  } else {
    const clamped = Math.max(1, Math.min(10, scale));
    container.style.minHeight = (clamped * 8) + 'vh'; // 1->8vh .. 10->80vh, additive on top of the rest of the layout
    appEl.style.height = 'auto';
    appEl.style.minHeight = '100%';
    document.body.style.overflowY = 'auto';
    document.documentElement.style.overflowY = 'auto';
  }
  // the existing ResizeObserver on chart-container picks up this size change
  // and calls chart.resize() reactively — no need to trigger it manually here
}

function openSettings() {
  const s = loadSettings();
  document.getElementById('setDefaultSymbol').value = s.defaultSymbol || currentSymbol;

  const tfSel = document.getElementById('setDefaultTimeframe');
  tfSel.innerHTML = TIMEFRAMES.map(tf => `<option value="${tf}"${tf === currentTimeframe ? ' selected' : ''}>${tf}</option>`).join('');

  settingsRiskMode = s.riskMode || riskMode;
  document.querySelectorAll('#setRiskModeToggle .mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === settingsRiskMode));
  document.getElementById('setRiskValue').value = s.riskValue ?? riskValue;
  document.getElementById('setDefaultTpPct').value = (s.defaultTpPct ?? 2.0);
  document.getElementById('setDefaultSlPct').value = (s.defaultSlPct ?? 1.0);
  document.getElementById('setChartHeightScale').value = s.chartHeightScale ?? '';
  document.getElementById('setApiKey').value = orderClient.apiKey;
  document.getElementById('setApiSecret').value = orderClient.apiSecret;

  settingsOverlay.classList.add('open');
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', () => settingsOverlay.classList.remove('open'));
document.querySelectorAll('#setRiskModeToggle .mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    settingsRiskMode = btn.dataset.mode;
    document.querySelectorAll('#setRiskModeToggle .mode-btn').forEach(b => b.classList.toggle('active', b === btn));
  });
});

document.getElementById('settingsSave').addEventListener('click', () => {
  const newSymbol = normalizeSymbolInput(document.getElementById('setDefaultSymbol').value) || currentSymbol;
  const newTimeframe = document.getElementById('setDefaultTimeframe').value;
  const newRiskValue = parseFloat(document.getElementById('setRiskValue').value) || 0;
  const newTpPct = parseFloat(document.getElementById('setDefaultTpPct').value) || 2.0;
  const newSlPct = parseFloat(document.getElementById('setDefaultSlPct').value) || 1.0;
  const rawScale = document.getElementById('setChartHeightScale').value.trim();
  const newChartHeightScale = rawScale === '' ? null : parseFloat(rawScale);

  saveSettings({
    defaultSymbol: newSymbol, defaultTimeframe: newTimeframe,
    riskMode: settingsRiskMode, riskValue: newRiskValue,
    defaultTpPct: newTpPct, defaultSlPct: newSlPct,
    chartHeightScale: newChartHeightScale,
  });
  applyChartHeightScale(newChartHeightScale);

  // apply immediately, session-memory only — never written to localStorage
  orderClient.apiKey = document.getElementById('setApiKey').value.trim();
  orderClient.apiSecret = document.getElementById('setApiSecret').value.trim();

  // reflect the new risk defaults in the always-visible risk bar too
  riskMode = settingsRiskMode;
  riskValue = newRiskValue;
  document.querySelectorAll('#riskModeToggle .mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === riskMode));
  document.getElementById('riskValueInput').value = riskValue;

  refreshBalanceDisplay();
  settingsOverlay.classList.remove('open');

  if (newSymbol !== currentSymbol || newTimeframe !== currentTimeframe) loadSymbol(newSymbol, newTimeframe);
});

/* ============================================================
   11. BOOTSTRAP — timeframe row + initial data load
   ============================================================ */
const tfRow = document.getElementById('tfRow');
TIMEFRAMES.forEach(tf => {
  const btn = document.createElement('button');
  btn.className = 'tf-btn' + (tf === currentTimeframe ? ' active' : '');
  btn.dataset.tf = tf;
  btn.textContent = tf;
  btn.addEventListener('click', () => loadSymbol(currentSymbol, tf));
  tfRow.appendChild(btn);
});

symbolNameEl.value = currentSymbol;
if (savedSettings.chartHeightScale != null) applyChartHeightScale(savedSettings.chartHeightScale);
loadSymbol(currentSymbol, currentTimeframe);

const countdownBadge = new CandleCountdownBadge();
series.attachPrimitive(countdownBadge);
setInterval(() => countdownBadge.refresh(), 1000);

})(); // end main()
</script>
