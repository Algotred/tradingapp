name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the GitHub web UI (Actions tab -> this workflow -> Run
# workflow) — useful from a phone where pushing a throwaway commit just
# to trigger a build is annoying.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (required by Gradle/Android build tools — 21 to match
          what Capacitor 8 actually generates in build.gradle by default)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      # Without this, every CI run signs the APK with a brand-new random
      # debug key (GitHub's runners are fully ephemeral, and Gradle
      # auto-generates ~/.android/debug.keystore if one doesn't exist).
      # Android refuses to install an APK over an existing app with a
      # DIFFERENT signature — that's what "App not installed" was. This
      # restores one committed, permanent keystore every run so builds
      # keep the same signature and always install cleanly as updates.
      - name: Restore consistent debug keystore
        run: |
          mkdir -p ~/.android
          cp keystores/debug.keystore ~/.android/debug.keystore

      # The android/ native project is intentionally NOT committed to git —
      # it's regenerated fresh on every CI run from capacitor.config.json.
      # This keeps the repo (and anything Termux needs to hold) small.
      - name: Add Android platform
        run: npx cap add android

      # Injects native-plugins/BybitSignerPlugin.java into the freshly
      # generated project and registers it in MainActivity — see
      # scripts/inject-plugin.sh for why this runs every build instead
      # of android/ being committed with the plugin already in place.
      - name: Inject BybitSigner native plugin
        run: bash scripts/inject-plugin.sh

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
