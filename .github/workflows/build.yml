name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔥 Set JDK 17 and force JAVA_HOME
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 🛡️ Force Gradle to use the exact JDK path
      - name: Configure Gradle JDK
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/screen-orientation
          npm install -D @capacitor/cli

      - name: Init Capacitor project
        run: |
          npx cap init "TradingChartApp" "com.algotred.tradingapp" --web-dir=www

      # 🛠️ Create www/ and copy assets
      - name: Copy web assets into www/
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp bybit-api.js www/

      - name: Add Android platform
        run: npx cap add android

      # 🔧 Fix Java 21 compatibility (still safe to keep)
      - name: Patch build.gradle for Java 21 compatibility (optional)
        run: |
          sed -i 's/sourceCompatibility JavaVersion.VERSION_17/sourceCompatibility JavaVersion.VERSION_21/' android/app/build.gradle
          sed -i 's/targetCompatibility JavaVersion.VERSION_17/targetCompatibility JavaVersion.VERSION_21/' android/app/build.gradle

      # ✅ Wire in the native BybitSigner plugin
      - name: Wire in native BybitSigner plugin
        run: |
          PKG_DIR="android/app/src/main/java/com/algotred/tradingapp"
          mkdir -p "$PKG_DIR"
          cp android-plugin/BybitSignerPlugin.java "$PKG_DIR/"

          echo "" >> android/app/build.gradle
          echo "dependencies {" >> android/app/build.gradle
          echo "    implementation 'androidx.security:security-crypto:1.1.0'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")

          sed -i '/import com.getcapacitor.BridgeActivity;/a import com.algotred.tradingapp.BybitSignerPlugin;' "$MAIN_ACTIVITY"

          perl -0777 -pi -e 's/class MainActivity extends BridgeActivity \{\s*\}/class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(BybitSignerPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}/' "$MAIN_ACTIVITY"

      - name: Sync web assets
        run: npx cap sync android

      # 🚀 Kill any existing Gradle daemon that might hold the wrong JDK
      - name: Clean Gradle daemon
        working-directory: android
        run: ./gradlew --stop

      # 🏗️ Build with explicit JDK path
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Trading App Build ${{ github.run_number }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
